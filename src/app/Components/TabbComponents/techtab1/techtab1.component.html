<div class="container-fluid bg-white p-3">
    <div class="row gy-4">
        <div class="col-lg-3 col-md-6 col-sm-12" *ngFor="let blog of blogs">
          <div class="card shadow-sm rounded-lg h-100">
            <img src="https://images.pexels.com/photos/262508/pexels-photo-262508.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" 
                 class="card-img-top w-100 rounded-top" 
                 style="object-fit: cover; height: 250px;" 
                 alt="Blogger Image">
            <div class="card-body d-flex flex-column">
              <h2 class="card-title">{{blog.blogTitle}}</h2>
              <div>
                 <h6> {{blog.blogCatagory}}</h6>
              </div>
            
              <div class="tags d-flex flex-wrap mt-2">
                <span class="badge" *ngFor="let tag of blog.tags">{{tag}}</span>
              </div>
    
              <p class="card-text mt-2">{{blog.blogShortDesc}}</p>
    
              <div class="mt-auto d-flex justify-content-end gap-2">
                  
                <a target="_blank" class="btn btn-sm btn-outline-success rounded-lg" (click)="viewBlog(blog._id)">
                  <i class="bi bi-github"></i> Read More
                </a>
              </div>
    
             
            </div>
          </div>
        </div>
      </div>
</div>
